name: Release

# Publishes a tagged version. Normally started by cut-release.yaml, which
# writes the changelog section, tags main and dispatches this workflow on the
# tag; a `v*` tag pushed by hand starts it through the push trigger instead.
# See RELEASING.md.
#
# goreleaser does the publishing: it cross-compiles the binary, packages the
# archives, signs checksums.txt with cosign (keyless, via this job's OIDC
# token), creates the GitHub Release and pushes the Homebrew formula to
# lockdep/homebrew-tap. The version comes from the tag; nothing in the
# repository holds it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch offers every branch in the picker. Running here from
      # a branch would publish an unversioned build.
      - name: Refuse to run off a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::Release must run on a tag, but was dispatched on ${GITHUB_REF}. Use the Cut release workflow to make one."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    name: Publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # cosign keyless signing via GitHub Actions OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the tag history

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "${version}" \
               | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${tag}' is not of the form v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists. Released versions are immutable — cut the next one instead (see RELEASING.md)."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes come from CHANGELOG.md. A release candidate for 1.2.0 carries
      # the 1.2.0 section if it has been written; otherwise the notes fall
      # back to goreleaser's commit-subject changelog, with a warning.
      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          candidates="${VERSION}"
          case "${VERSION}" in *-*) candidates="${VERSION} ${VERSION%%-*}" ;; esac

          section=""
          for candidate in ${candidates}; do
            if python3 .github/scripts/changelog.py "${candidate}" \
                 --notes "${RUNNER_TEMP}/changelog-notes.md"; then
              section="${candidate}"
              break
            else
              status=$?
              [ "${status}" -eq 3 ] || exit "${status}"
            fi
          done

          if [ -n "${section}" ]; then
            echo "--- CHANGELOG.md section for ${section} ---"
            cat "${RUNNER_TEMP}/changelog-notes.md"
            echo "args=--release-notes=${RUNNER_TEMP}/changelog-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no section for ${VERSION}; release notes fall back to commit subjects."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build, sign and publish
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.changelog.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is scoped to this repository; pushing the formula to
          # lockdep/homebrew-tap needs a token that can write there.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Summarise
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Released \`v${VERSION}\`"
            echo
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
            echo "- \`brew install lockdep/tap/stackradar\`"
            echo "- \`go install github.com/lockdep/stackradar-cli@v${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
